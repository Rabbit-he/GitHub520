name: GitHub520 Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: github520-auto-update
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f actions_requirements.txt ]; then
            pip install -r actions_requirements.txt
          fi

      - name: Run update script
        run: python update_ips.py

      - name: Commit and push changes
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- README.md hosts hosts.json; then
            echo "No changes detected."
            exit 0
          fi

          git config user.email "action_bot@users.noreply.github.com"
          git config user.name "action_bot"
          git add README.md hosts hosts.json
          git commit -m "chore: auto update GitHub520 hosts"
          git push origin HEAD:"${BRANCH_NAME}"
